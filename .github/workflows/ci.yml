name: Docs CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check links
        run: npx -y mint@4.3.63 broken-links

      - name: Export static site
        run: npx -y mint@4.3.63 export

      - name: Build agent files from the export
        run: |
          rm -rf site
          mkdir site
          unzip -q export.zip -d site
          python3 scripts/build_agent_files.py --site site
          test -s site/llms.txt
          test -s site/llms-full.txt
          test -f site/index.html
