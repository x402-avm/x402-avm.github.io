name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check links
        run: npx -y mint@4.3.63 broken-links

      - name: Export static site
        run: npx -y mint@4.3.63 export

      - name: Unpack export
        run: |
          rm -rf site
          mkdir site
          unzip -q export.zip -d site
          touch site/.nojekyll

      - name: Write Markdown pages, llms.txt, llms-full.txt and sitemap.xml
        run: python3 scripts/build_agent_files.py --site site

      - name: Add search (mark content, inject search UI)
        run: python3 scripts/add_search.py --site site

      - name: Write redirect stubs for moved pages
        run: python3 scripts/add_redirects.py --site site

      - name: Check internal links in the exported site
        run: python3 scripts/check_site_links.py --site site

      - name: Build search index
        run: npx -y pagefind@1.6.0 --site site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
